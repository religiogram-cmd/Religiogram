name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same PR so we don't waste minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────── BACKEND ─────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: religiogram-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     religio
          POSTGRES_PASSWORD: religio
          POSTGRES_DB:       religiogram_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:           test
      DATABASE_URL:       postgresql://religio:religio@localhost:5432/religiogram_test
      REDIS_URL:          redis://localhost:6379
      JWT_SECRET:         ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      RAZORPAY_KEY_ID:     rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-razorpay-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: religiogram-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage gate
        run: npm run test:cov:gate --if-present || npm test -- --coverage

  # ─────────────────────────────── FRONTEND ────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: religiogram-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: religiogram-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test --if-present -- --passWithNoTests

      - name: Build (production)
        env:
          # The build needs a backend rewrite target; the value doesn't matter
          # for the build itself, only that the var is set.
          BACKEND_URL: http://localhost:3000
        run: npm run build
