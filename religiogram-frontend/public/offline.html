<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReligioGram — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF6F0;
      color: #3D2B1F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 320px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #D9622E; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: #6B4E3D; margin-bottom: 24px; }
    button {
      background: #D9622E;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🕉️</div>
    <h1>You're Offline</h1>
    <p>ReligioGram needs a connection to show you live spiritual services. Please check your internet and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
