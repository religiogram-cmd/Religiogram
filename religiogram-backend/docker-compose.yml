# ──────────────────────────────────────────────────────────────────────────
#  ReligioGram — Full Observability + Gateway Stack
#
#  Includes: Postgres, PgBouncer, Redis, Kafka (2-broker HA) + Zookeeper,
#            Schema Registry, OpenSearch, OpenSearch Dashboards, Prometheus,
#            Grafana, Jaeger (badger storage), Kong API Gateway,
#            2 × Backend replicas
#
#  Bring up:    docker compose up --build
#  Run migrations: docker compose exec backend1 npm run migration:run
#  Tear down + wipe data: docker compose down -v
# ──────────────────────────────────────────────────────────────────────────

services:

  # ── Databases ───────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    # Load pg_stat_statements at server start so CREATE EXTENSION works in init.sql.
    # pg_partman_bgw provides the background worker for automatic maintenance;
    # install pg_partman first (see docker/Dockerfile.postgres for the apk add step).
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c track_io_timing=on
        -c log_min_duration_statement=500
    environment:
      POSTGRES_USER: religiogram
      POSTGRES_PASSWORD: ${DB_PASSWORD:-religiogram_secret}
      POSTGRES_DB: religiogram
    ports: ['5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U religiogram -d religiogram"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:1.21.0
    container_name: religiogram_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: religiogram
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:-religiogram_secret}
      POSTGRESQL_DATABASE: religiogram
      PGBOUNCER_DATABASE: religiogram
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 2000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
      PGBOUNCER_MIN_POOL_SIZE: 10
      PGBOUNCER_RESERVE_POOL_SIZE: 10
      PGBOUNCER_AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (queues, throttle, sessions) ──────────────────────────
  # noeviction: Redis returns an error on new writes when maxmemory is
  # reached.  This protects BullMQ job data and throttle counters from
  # silent eviction.  If this Redis fills up, the API returns 503 errors,
  # which is much easier to debug than silently dropped jobs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --maxmemory 1gb
        --maxmemory-policy noeviction
        --save 60 1
    ports: ['6379:6379']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Redis Cache (HTTP response cache) ────────────────────────────
  # allkeys-lru: evicts the least-recently-used entry when full.
  # Safe for HTTP cache because every entry is re-fetchable from the DB.
  # Kept separate from the queue Redis so cache pressure can never evict
  # job or session data.
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save ""
    ports: ['6380:6379']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka ───────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: religiogram_kafka1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      # PR8: ISR=2 — require 2 brokers to ack before commit to prevent data loss
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # 12 partitions per topic by default. Hot topics (consultations, social feed,
      # notifications) are created with higher partition counts via kafka-init service.
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Compress batches with lz4 for ~50% storage saving at negligible CPU cost.
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: religiogram_kafka2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      # PR8: ISR=2 — require 2 brokers to ack before commit to prevent data loss
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka topic initialiser ────────────────────────────────────
  # Creates hot-path topics with higher partition counts for lakh-scale.
  # Runs once at startup and exits.
  #   rg.consultations : 24 partitions (per-minute billing fan-out)
  #   rg.social        : 24 partitions (feed fan-out — highest write volume)
  #   rg.notifications : 16 partitions (push notification dispatch)
  #   rg.bookings      : 12 partitions (booking state machine events)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Kafka to be fully ready..."
        sleep 10
        echo "Creating Kafka topics for lakh-scale..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.consultations --partitions 24 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.social --partitions 24 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.notifications --partitions 16 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.bookings --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.payments --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.wallet --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.users --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.providers --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.reviews --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.fraud --partitions 12 --replication-factor 2
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rg.notifications.dlq --partitions 4 --replication-factor 2
        echo "Kafka topic initialisation complete."
        kafka-topics --bootstrap-server kafka:29092 --list

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    restart: unless-stopped
    depends_on:
      - kafka
      - kafka2
    ports: ['8081:8081']
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092,kafka2:9093

  # ── Kafka Exporter ─────────────────────────────────────────────
  #
  # Exposes Kafka broker + consumer-group lag metrics for Prometheus.
  # Key metrics:
  #   kafka_consumergroup_lag{consumergroup,topic,partition}
  #   kafka_consumergroup_lag_sum{consumergroup,topic}
  #   kafka_topic_partition_current_offset{topic,partition}
  #   kafka_topic_partition_under_replicated_partition{topic,partition}
  #
  # Alert rules: config/prometheus/rules/kafka-lag.yml
  # Thresholds: warn @ lag_sum > 10 000 for 5m, critical @ 100 000 for 2m
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    ports: ['9308:9308']
    command:
      - --kafka.server=kafka:29092
      - --kafka.server=kafka2:9093
      - --kafka.version=3.5.0
      - --web.listen-address=:9308
      - --web.telemetry-path=/metrics
      - --topic.filter=.*          # scrape all topics
      - --group.filter=.*          # scrape all consumer groups
      - --log.level=warn
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9308/metrics']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL Exporter ─────────────────────────────────────────
  #
  # Exposes PostgreSQL internal metrics for Prometheus:
  #   pg_stat_statements (slow queries), pg_stat_activity (connections),
  #   table bloat, partition row counts.
  #
  # DATA_SOURCE_NAME bypasses PgBouncer — connects directly to Postgres
  # so pg_stat_statements and advisory-lock queries work correctly.
  #
  # Custom queries loaded from config/postgres-exporter/queries.yaml
  # Alert rules: config/prometheus/rules/db-pool.yml + slow-query.yml
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['9187:9187']
    environment:
      DATA_SOURCE_NAME: "postgresql://religiogram:${DB_PASSWORD:-religiogram_secret}@postgres:5432/religiogram?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
      PG_EXPORTER_METRIC_PREFIX: pg
    volumes:
      - ./config/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    command:
      - '--extend.query-path=/etc/postgres-exporter/queries.yaml'
      - '--log.level=warn'
      - '--web.listen-address=:9187'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9187/metrics']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OpenSearch — 2-node cluster ────────────────────────────────
  #
  # Two nodes so indices can have number_of_replicas=1.
  # Each shard has one primary + one replica on the other node:
  #   - Reads are load-balanced across both replicas
  #   - If one node dies, the other promotes its replica to primary
  #     and the cluster stays GREEN (no data loss)
  #
  # OPENSEARCH_JAVA_OPTS: 512 MB heap each → 1 GB total on the Docker host.
  # Increase to -Xms1g -Xmx1g per node when the dataset grows beyond ~5 GB.
  #
  # cluster.initial_master_nodes bootstraps the cluster for the very first
  # start; once the cluster is formed OpenSearch ignores this setting.
  # discovery.seed_hosts lets each node find the other.
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-node1
    restart: unless-stopped
    environment:
      - node.name=opensearch-node1
      - cluster.name=religiogram-os-cluster
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - discovery.seed_hosts=opensearch-node2
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Require explicit acknowledgement from at least (n/2)+1 nodes before
      # marking a write successful. With 2 nodes this is 1, which is fine
      # since each node holds one copy of every shard.
      - cluster.routing.allocation.awareness.attributes=rack
      - node.attr.rack=rack1
    ports: ['9200:9200', '9600:9600']
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  opensearch-node2:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-node2
    restart: unless-stopped
    environment:
      - node.name=opensearch-node2
      - cluster.name=religiogram-os-cluster
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - discovery.seed_hosts=opensearch
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - node.attr.rack=rack2
    volumes:
      - opensearch_data2:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      - opensearch

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    restart: unless-stopped
    depends_on:
      - opensearch
      - opensearch-node2
    ports: ['5601:5601']
    environment:
      # Point dashboards at node1; it fans queries to the whole cluster internally.
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'

  # ── Observability ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports: ['9090:9090']
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # ── Alertmanager — routes Prometheus alerts to Slack + PagerDuty ────────────
  #
  # Configuration: config/alertmanager/alertmanager.yml
  # Set real webhook/integration keys before production deploy.
  # UI: http://localhost:9093
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports: ['9093:9093']
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--log.level=warn'
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports: ['3001:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-religiogram_grafana_2024}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.56
    restart: unless-stopped
    ports:
      - '16686:16686'   # Jaeger UI
      - '14268:14268'   # Jaeger collector HTTP
      - '6831:6831/udp' # Jaeger agent UDP
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger

  # ── API Gateway (Kong) ───────────────────────────────────────────
  kong:
    image: kong:3.6-alpine
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '127.0.0.1:8001'
      KONG_PLUGINS: bundled
    ports:
      - '80:8000'    # HTTP proxy
      - '443:8443'   # HTTPS proxy
    volumes:
      - ./config/kong:/kong/declarative:ro
    depends_on:
      - backend1
      - backend2
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (2 replicas to simulate multi-pod) ────────────────────
  backend1:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka2: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://religiogram:${DB_PASSWORD:-religiogram_secret}@pgbouncer:6432/religiogram
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: '6379'
      KAFKA_BROKERS: "kafka:29092,kafka2:9093"
      OPENSEARCH_NODE: http://opensearch:9200
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      PORT: '3000'
    ports: ['3000:3000']
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend2:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka2: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://religiogram:${DB_PASSWORD:-religiogram_secret}@pgbouncer:6432/religiogram
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: '6379'
      KAFKA_BROKERS: "kafka:29092,kafka2:9093"
      OPENSEARCH_NODE: http://opensearch:9200
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      PORT: '3000'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  kafka2_data:
  zookeeper_data:
  zookeeper_logs:
  opensearch_data:
  opensearch_data2:
  prometheus_data:
  grafana_data:
  jaeger_data:
