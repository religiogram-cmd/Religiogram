[databases]
religiogram_db = host=postgres port=5432 dbname=religiogram_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# ── Pool mode ────────────────────────────────────────────────────────────────
# transaction mode: server connection returned to pool after each transaction.
# This is the correct mode for 1M+ user scale — allows many more app connections
# than server connections (200 clients → 25 server connections).
#
# ⚠ INCOMPATIBLE features in transaction mode:
#   • SET/RESET commands that persist across transactions (use Postgres defaults
#     set in postgresql.conf or via ALTER ROLE instead)
#   • LISTEN/NOTIFY (use a dedicated session-mode pgbouncer or direct connection)
#   • Advisory locks: pg_advisory_lock() is session-scoped and will misbehave.
#     TypeORM migrations use advisory locks → run migrations via DATABASE_DIRECT_URL
#     (direct Postgres connection, bypassing PgBouncer).
#   • Prepared statements with names: use unnamed ($1 placeholders) or disable
#     prepared statement caching (node-postgres extra.prepare=false).
pool_mode = transaction

# Reset query must be empty in transaction mode — there is no server-side session
# state to reset because connections are returned after each transaction.
server_reset_query =
server_reset_query_always = 0

max_client_conn = 2000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 60
query_timeout = 0
query_wait_timeout = 120

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

# TypeORM (node-postgres) sets `extra_float_digits`, `application_name`, and
# `search_path` at connection startup. Ignore them so they don't cause errors
# when connections are recycled in transaction mode.
ignore_startup_parameters = extra_float_digits,search_path,options

# Enable TCP keepalive so idle server connections are detected quickly.
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5
