# ──────────────────────────────────────────────────────────────────────────
#  Local nginx — mirrors the prod ALB.
#
#  Listens on :80, round-robins between api1 and api2, and excludes a pod
#  from rotation if its readiness probe fails 3 consecutive times. In prod
#  this whole file is replaced by an ALB target group with the same checks.
# ──────────────────────────────────────────────────────────────────────────

# ── Standard REST upstream — round-robin across both API pods ──────────────
upstream religiogram_api {
    # max_fails + fail_timeout = "stop sending traffic for 30s after 3 fails"
    server api1:3000 max_fails=3 fail_timeout=30s;
    server api2:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── WebSocket / consultation upstream — IP-hash sticky sessions ─────────────
#
# P2-1: Socket.IO sessions MUST land on the same backend pod for the life of
# the connection.  Even though socket.io-redis-adapter broadcasts events across
# pods, the initial handshake and upgrade MUST complete on one pod.  Nginx
# ip_hash satisfies this; for cloud LBs (AWS ALB / GCP HTTPS LB) use the
# equivalent sticky-session cookie attribute instead.
#
# In production on Hetzner with two CCX21 app nodes this nginx block runs on
# the same box as both pods; the sticky config ensures reconnects after a
# SIGTERM (rolling deploy) re-use the same target.
upstream religiogram_ws {
    ip_hash;                              # sticky — one client → one pod
    server api1:3000 max_fails=3 fail_timeout=30s;
    server api2:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;                         # WS connections are long-lived
}

server {
    listen 80;
    server_name _;

    # Body size cap — file uploads go direct to S3/R2 via pre-signed URLs,
    # so the API itself never receives anything bigger than a JSON form.
    client_max_body_size 200k;

    # Generous timeouts for the OTP send path (msg91 can be slow).
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    # ── WebSocket namespace (Socket.IO consultation) ─────────────────────────
    # Must come before the catch-all location / block.
    # Upgrade: websocket header enables the HTTP→WS protocol switch.
    location /socket.io/ {
        proxy_pass http://religiogram_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WS connections alive for up to 1 h (consultation session max).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://religiogram_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generate a request id if the client didn't, so log correlation
        # works whether or not callers know about it.
        proxy_set_header X-Request-Id      $request_id;
    }

    # Active health probe — readiness checks DB + Redis.
    # Returns 200 only when both are reachable.
    location = /healthz {
        proxy_pass http://religiogram_api/api/v1/health/ready;
        access_log off;
    }
}
