; ============================================================
; Appendix B — pgbouncer.ini
; Transaction-pooling mode for ReligioGram backend pods
;
; Install: apt install pgbouncer
; Config:  /etc/pgbouncer/pgbouncer.ini
; Reload:  systemctl reload pgbouncer
; ============================================================

[databases]
; Connect as user `religiogram` to the local Postgres instance.
; Replace 192.168.1.10 with the actual DB private IP on Hetzner.
religiogram = host=192.168.1.10 port=5432 dbname=religiogram
  pool_size=50 reserve_pool_size=10

[pgbouncer]
; ── Network ──────────────────────────────────────────────────
listen_addr     = 0.0.0.0
listen_port     = 5432

; Only allow connections from the app pods' subnet.
; Set to * during initial setup, tighten after networking is confirmed.
;trusted_addr   = 10.0.0.0/8

; ── Pooling mode ─────────────────────────────────────────────
; transaction mode: each transaction gets a server connection from the pool.
; Requires TypeORM prepared-statement disable (DATABASE_VIA_PROXY=true in .env).
pool_mode       = transaction

; ── Authentication ───────────────────────────────────────────
auth_type       = scram-sha-256
auth_file       = /etc/pgbouncer/userlist.txt

; ── Pool limits ──────────────────────────────────────────────
; 2 pods × 25 connections/pod = 50 app connections.
; Reserve 20 for monitoring / migration runner.
max_client_conn = 2000         ; client-side (NestJS) connections — lakh-scale
default_pool_size = 50         ; server-side connections to Postgres per database — lakh-scale
min_pool_size   = 10
reserve_pool_size = 10
reserve_pool_timeout = 5       ; seconds to wait before using reserve pool
max_db_connections = 100       ; hard cap to Postgres — lakh-scale

; ── Timeouts ─────────────────────────────────────────────────
server_idle_timeout   = 600    ; close idle server connections after 10 min (warm connections)
client_idle_timeout   = 0      ; no client-side idle timeout (app handles it)
query_timeout         = 10     ; kill queries running > 10 s at PgBouncer level
client_login_timeout  = 15

; ── Logging ──────────────────────────────────────────────────
log_connections = 0            ; suppress per-connection noise
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60              ; emit stats every 60 s

; ── Admin ────────────────────────────────────────────────────
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats, monitoring
