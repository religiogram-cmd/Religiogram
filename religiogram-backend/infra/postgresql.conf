# ============================================================
# Appendix A — postgresql.conf for Hetzner CCX23
# 4 vCPU  |  16 GB RAM  |  NVMe SSD
#
# Tuned exactly to the ReligioGram Minimal-Cost Master Plan spec.
# Copy to /etc/postgresql/16/main/postgresql.conf (or overlay via
# Docker volume) and reload: `pg_ctlcluster 16 main reload`
# ============================================================

# ── Connections ─────────────────────────────────────────────
# PgBouncer sits in front (port 6432, transaction pooling).
# 200 direct connections: monitoring + migration runner + pod pools.
max_connections = 200
superuser_reserved_connections = 3

# ── Memory (target: ~75 % of 16 GB for Postgres) ────────────
shared_buffers             = 4GB        # 25 % of 16 GB RAM
effective_cache_size       = 12GB       # OS page cache estimate
work_mem                   = 64MB       # per sort/hash op — lakh-scale; 200 × 64 = 12.8 GB peak (fine with 16 GB)
maintenance_work_mem       = 1GB        # VACUUM, CREATE INDEX — lakh-scale index builds
wal_buffers                = 64MB       # lakh-scale: higher WAL throughput for many concurrent writes

# ── Write-ahead log ─────────────────────────────────────────
wal_level                  = replica    # needed for WAL-G PITR
max_wal_size               = 2GB
min_wal_size               = 128MB
checkpoint_completion_target = 0.9
checkpoint_timeout         = 10min

# ── Planner ─────────────────────────────────────────────────
random_page_cost           = 1.1        # NVMe SSD — almost sequential
effective_io_concurrency   = 200        # NVMe can handle many concurrent ops
default_statistics_target  = 100

# ── Autovacuum — tuned for high-write partitioned tables ────
autovacuum                 = on
autovacuum_vacuum_scale_factor   = 0.02 # vacuum at 2 % dead tuples (vs 20 %)
autovacuum_analyze_scale_factor  = 0.01
autovacuum_vacuum_cost_delay     = 2ms  # less IO throttling on NVMe
autovacuum_max_workers     = 4
autovacuum_naptime         = 30s        # check tables every 30 s

# ── Logging ─────────────────────────────────────────────────
log_min_duration_statement = 200        # log queries > 200 ms
log_checkpoints            = on
log_connections            = off        # avoid noise from pgbouncer
log_disconnections         = off
log_lock_waits             = on
log_temp_files             = 10MB
log_line_prefix            = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ── Performance ─────────────────────────────────────────────
synchronous_commit         = on         # safest default; relax on batch jobs
max_parallel_workers_per_gather = 4
max_parallel_workers       = 8
max_worker_processes       = 8

# ── Extensions pre-load ─────────────────────────────────────
shared_preload_libraries   = 'pg_stat_statements'
pg_stat_statements.max     = 10000
pg_stat_statements.track   = all
track_io_timing            = on

# ── Locale + timezone ───────────────────────────────────────
timezone                   = 'UTC'
log_timezone               = 'UTC'
datestyle                  = 'iso, mdy'
lc_messages                = 'en_US.UTF-8'
