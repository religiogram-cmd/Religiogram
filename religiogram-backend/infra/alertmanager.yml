# ============================================================
# Appendix G — Alertmanager configuration
# Routes critical alerts to Slack + Telegram (on-call paging).
# WARNING alerts go to Telegram only.
#
# Required env vars:
#   SLACK_WEBHOOK_URL         — incoming webhook for #religiogram-alerts
#   TELEGRAM_ALERT_BOT_TOKEN  — bot token for @ReligioGramAlertsBot
#   TELEGRAM_ALERT_CHAT_ID    — founder chat ID
#
# Place at: /etc/alertmanager/alertmanager.yml  OR
# mount as docker volume in docker-compose.observability.yml
# ============================================================

global:
  resolve_timeout: 5m
  # Telegram bot token for @ReligioGramAlertsBot
  # Set via env var or deploy secret — do NOT commit the real token.
  # The receiver below uses this for HTTP auth.

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  # Default receiver for all alerts not matched below
  receiver: telegram-critical
  group_by: ['alertname', 'severity']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h

  routes:
    # ── P0 / critical — page via Slack + Telegram simultaneously ──
    - matchers:
        - severity="critical"
      receiver: critical-multi
      group_wait: 10s        # faster paging for critical
      repeat_interval: 1h

    # ── Warning / P1 ─────────────────────────────────────────
    - matchers:
        - severity="warning"
      receiver: telegram-warnings
      group_wait: 2m
      repeat_interval: 6h

    # ── Cost-lock alerts — always P0 ─────────────────────────
    - matchers:
        - alertname=~"CostLock.*"
      receiver: critical-multi
      group_wait: 0s         # immediate on cost-lock events

    # ── Watchdog (heartbeat) — silence by default ─────────────
    - matchers:
        - alertname="Watchdog"
      receiver: blackhole

receivers:
  - name: telegram-critical
    # Legacy receiver — prefer critical-multi for new alert routes
    telegram_configs:
      - bot_token: "${TELEGRAM_ALERT_BOT_TOKEN}"   # injected at runtime
        chat_id: "${TELEGRAM_ALERT_CHAT_ID}"        # injected at runtime
        parse_mode: HTML
        message: |
          🚨 <b>{{ .CommonLabels.alertname }}</b> [{{ .CommonLabels.severity | toUpper }}]
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b>
          {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          🕐 Fired: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}
        send_resolved: true

  - name: critical-multi
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: '#religiogram-alerts'
        username: 'AlertManager'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: '{{ if .CommonLabels.severity }}[{{ .CommonLabels.severity | toUpper }}]{{ end }} {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Summary:* {{ .Annotations.summary }}
          {{ if .Annotations.description }}*Details:* {{ .Annotations.description }}{{ end }}
          *Fired:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}
    telegram_configs:
      - bot_token: "${TELEGRAM_ALERT_BOT_TOKEN}"
        chat_id: "${TELEGRAM_ALERT_CHAT_ID}"
        parse_mode: HTML
        message: |
          🚨 <b>{{ .CommonLabels.alertname }}</b> [{{ .CommonLabels.severity | toUpper }}]
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b>
          {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          🕐 Fired: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}
        send_resolved: true

  - name: telegram-warnings
    telegram_configs:
      - bot_token: "${TELEGRAM_ALERT_BOT_TOKEN}"
        chat_id: "${TELEGRAM_ALERT_CHAT_ID}"
        parse_mode: HTML
        message: |
          ⚠️ <b>{{ .CommonLabels.alertname }}</b> [{{ .CommonLabels.severity | toUpper }}]
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
        send_resolved: false  # don't spam on recovery for warnings

  - name: blackhole
    # Suppress the Watchdog heartbeat alert
    webhook_configs: []

inhibit_rules:
  # Suppress warning-severity alerts if a critical alert is firing for the
  # same alertname + instance, to reduce noise during a major incident.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']
