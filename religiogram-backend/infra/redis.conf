# ============================================================
# Appendix C — redis.conf for Hetzner CX31 (Redis + Workers)
# 4 vCPU  |  8 GB RAM
#
# Manages two logical Redis instances on different ports:
#   :6379 — cache database (eviction: allkeys-lru)
#   :6380 — queues + session data (eviction: noeviction)
#
# Run two instances by copying this file as:
#   /etc/redis/redis-cache.conf (port 6379, maxmemory 2gb, allkeys-lru)
#   /etc/redis/redis-queue.conf (port 6380, maxmemory 3gb, noeviction)
# ============================================================

# ── Network ─────────────────────────────────────────────────
bind 127.0.0.1 10.0.0.1         # loopback + private Hetzner network IP
# bind 0.0.0.0                  # NEVER bind to public interface

protected-mode yes
port 6379                        # change to 6380 for queue instance

# ── Security ─────────────────────────────────────────────────
requirepass CHANGE_ME_STRONG_PASSWORD_HERE
rename-command FLUSHALL ""       # disable FLUSHALL in production
rename-command FLUSHDB  ""       # disable FLUSHDB  in production
rename-command DEBUG    ""       # disable DEBUG

# ── Memory ───────────────────────────────────────────────────
maxmemory 2gb                    # 2 GB for cache; 3 GB for queue instance

# Cache instance — evict least-recently-used keys when full.
# Queue instance — MUST be noeviction to never silently drop jobs.
maxmemory-policy allkeys-lru     # change to noeviction for queue instance

maxmemory-samples 10             # sample size for LRU approximation
activerehashing yes

# ── Persistence ──────────────────────────────────────────────
# Cache: RDB-only is fine (data is rebuildable).
# Queue: AOF + RDB for durability (jobs must not be lost).
save 900 1
save 300 10
save 60 10000

# Enable AOF for the queue instance. Comment out for cache.
appendonly yes
# appendfsync everysec
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

dir /var/lib/redis
dbfilename dump.rdb

# ── Slow log ─────────────────────────────────────────────────
slowlog-log-slower-than 10000    # log commands taking > 10 ms
slowlog-max-len 256

# ── Clients ──────────────────────────────────────────────────
maxclients 1000
tcp-backlog 511
tcp-keepalive 300
timeout 0                        # don't close idle client connections

# ── Key expiry notifications (for OTP expiry events) ─────────
# Disabled by default — enable only if needed (has CPU cost).
# notify-keyspace-events "Ex"

# ── Latency monitoring ───────────────────────────────────────
latency-monitor-threshold 20     # track events with latency > 20 ms
latency-history yes

# ── Logging ──────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis.log
