# ──────────────────────────────────────────────────────────────────────────────
#  postgres_exporter — custom query definitions
#
#  These extend the default metrics with ReligioGram-specific observability:
#    • pg_stat_statements  — top-20 slowest queries (mean execution time)
#    • pg_pool_stats       — active connections per database/user
#    • pg_partition_stats  — row counts for partitioned tables
#    • pg_bloat            — table/index bloat estimates
#
#  Loaded via: --extend.query-path=/etc/postgres-exporter/queries.yaml
# ──────────────────────────────────────────────────────────────────────────────

pg_stat_statements_top_slow:
  query: |
    SELECT
      LEFT(query, 200)                                  AS query_snippet,
      calls,
      ROUND(mean_exec_time::numeric, 2)                 AS mean_exec_time_ms,
      ROUND(total_exec_time::numeric, 2)                AS total_exec_time_ms,
      ROUND(stddev_exec_time::numeric, 2)               AS stddev_exec_time_ms,
      ROUND(rows::numeric / NULLIF(calls, 0), 2)        AS avg_rows,
      ROUND(shared_blks_hit::numeric /
        NULLIF(shared_blks_hit + shared_blks_read, 0) * 100, 2) AS cache_hit_pct
    FROM pg_stat_statements
    WHERE calls > 10
      AND mean_exec_time > 100
    ORDER BY mean_exec_time DESC
    LIMIT 20
  metrics:
    - query_snippet:
        usage: LABEL
        description: First 200 chars of the query text
    - calls:
        usage: COUNTER
        description: Total number of times this query was executed
    - mean_exec_time_ms:
        usage: GAUGE
        description: Mean execution time in milliseconds
    - total_exec_time_ms:
        usage: COUNTER
        description: Total execution time in milliseconds (cumulative)
    - stddev_exec_time_ms:
        usage: GAUGE
        description: Standard deviation of execution time in milliseconds
    - avg_rows:
        usage: GAUGE
        description: Average rows returned per execution
    - cache_hit_pct:
        usage: GAUGE
        description: Buffer cache hit percentage (100 = no disk reads)

pg_active_connections:
  query: |
    SELECT
      datname                         AS database,
      usename                         AS username,
      state,
      COUNT(*)                        AS count,
      MAX(EXTRACT(EPOCH FROM (NOW() - query_start)))::int AS max_query_age_s
    FROM pg_stat_activity
    WHERE pid <> pg_backend_pid()
    GROUP BY datname, usename, state
  metrics:
    - database:
        usage: LABEL
        description: Database name
    - username:
        usage: LABEL
        description: Connected user
    - state:
        usage: LABEL
        description: Connection state (active, idle, idle in transaction, etc.)
    - count:
        usage: GAUGE
        description: Number of connections in this state
    - max_query_age_s:
        usage: GAUGE
        description: Oldest running query age in seconds (0 for idle connections)

pg_long_running_queries:
  query: |
    SELECT
      COUNT(*) AS count,
      MAX(EXTRACT(EPOCH FROM (NOW() - query_start)))::int AS max_duration_s
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query NOT LIKE '%pg_stat%'
      AND query_start < NOW() - INTERVAL '5 seconds'
      AND pid <> pg_backend_pid()
  metrics:
    - count:
        usage: GAUGE
        description: Number of queries running longer than 5 seconds
    - max_duration_s:
        usage: GAUGE
        description: Duration in seconds of the longest running query

pg_partition_row_counts:
  query: |
    SELECT
      n.nspname   AS schema_name,
      c.relname   AS table_name,
      c.reltuples AS estimated_rows
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE c.relkind IN ('r', 'p')          -- regular or partitioned table
      AND c.relname IN (
        'bookings', 'ledger_entries', 'notifications', 'feed_items'
      )
      AND n.nspname = 'public'
    ORDER BY c.reltuples DESC
  metrics:
    - schema_name:
        usage: LABEL
        description: Schema name
    - table_name:
        usage: LABEL
        description: Table name
    - estimated_rows:
        usage: GAUGE
        description: Estimated row count from pg_class.reltuples (updated by ANALYZE)

pg_table_bloat_estimate:
  query: |
    SELECT
      schemaname  AS schema_name,
      tablename   AS table_name,
      ROUND(pg_total_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename)) /
            1024.0 / 1024.0, 2) AS total_size_mb,
      ROUND(pg_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename)) /
            1024.0 / 1024.0, 2) AS table_size_mb,
      ROUND((pg_total_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename)) -
             pg_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename))) /
            1024.0 / 1024.0, 2) AS index_size_mb,
      n_dead_tup,
      n_live_tup,
      CASE WHEN n_live_tup > 0
        THEN ROUND(n_dead_tup::numeric / n_live_tup * 100, 1)
        ELSE 0
      END AS dead_tuple_ratio_pct,
      last_autovacuum,
      last_autoanalyze
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND (n_live_tup + n_dead_tup) > 10000
    ORDER BY total_size_mb DESC
    LIMIT 20
  metrics:
    - schema_name:
        usage: LABEL
        description: Schema name
    - table_name:
        usage: LABEL
        description: Table name
    - total_size_mb:
        usage: GAUGE
        description: Total table size including indexes in MB
    - table_size_mb:
        usage: GAUGE
        description: Table heap size in MB (excludes indexes)
    - index_size_mb:
        usage: GAUGE
        description: Total index size in MB
    - n_dead_tup:
        usage: GAUGE
        description: Number of dead tuples (pending autovacuum cleanup)
    - n_live_tup:
        usage: GAUGE
        description: Number of live tuples
    - dead_tuple_ratio_pct:
        usage: GAUGE
        description: Dead tuple ratio as percentage of live tuples
    - last_autovacuum:
        usage: LABEL
        description: Timestamp of last autovacuum run
    - last_autoanalyze:
        usage: LABEL
        description: Timestamp of last autoanalyze run
