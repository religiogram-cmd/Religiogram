# ──────────────────────────────────────────────────────────────────────────────
#  Alertmanager Secrets — populate with actual values before deploying.
#  NEVER commit real values to version control.
#
#  Apply:
#    kubectl apply -f k8s/monitoring/alertmanager-secrets.yaml
#
#  After apply, rotate values:
#    kubectl create secret generic alertmanager-secrets \
#      --namespace religiogram \
#      --from-literal=SLACK_WEBHOOK_URL=https://hooks.slack.com/services/... \
#      --from-literal=PAYMENTS_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/... \
#      --from-literal=PAGERDUTY_INTEGRATION_KEY=... \
#      --dry-run=client -o yaml | kubectl apply -f -
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: religiogram
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "CHANGE_ME"
  PAYMENTS_SLACK_WEBHOOK_URL: "CHANGE_ME"
  PAGERDUTY_INTEGRATION_KEY: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
