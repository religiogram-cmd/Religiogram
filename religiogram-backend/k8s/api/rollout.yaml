---
# PR6: Argo Rollouts canary deployment for the ReligioGram API.
#
# This replaces the standard Deployment with an Argo Rollouts Rollout resource
# that implements a stepped canary strategy:
#   - 10% canary traffic for 1 minute
#   - 30% for 2 minutes (with a manual pause for smoke tests)
#   - 60% for 2 minutes
#   - Full rollout (100%)
#
# Rollback trigger: if error-rate alert fires during canary, Argo Rollouts
# automatically aborts and routes 100% back to the stable ReplicaSet.
#
# Prerequisites:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts \
#     -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# Apply:
#   kubectl apply -f k8s/api/rollout.yaml
#
# Monitor:
#   kubectl argo rollouts get rollout api -n religiogram --watch
#   kubectl argo rollouts promote api -n religiogram        # advance past pause

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: religiogram
  labels:
    app: api
    component: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "3000"
        prometheus.io/path:   "/metrics"
        checksum/config: "change-me-in-ci"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: api

      initContainers:
        - name: wait-for-pgbouncer
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z pgbouncer 6432; do echo 'waiting...'; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo 'waiting...'; sleep 2; done"]

      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: religiogram-api-secrets
            - configMapRef:
                name: religiogram-api-config
                optional: true
          resources:
            requests:
              cpu:    250m
              memory: 256Mi
            limits:
              cpu:    "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api

  # ── Canary strategy ────────────────────────────────────────────────────────
  strategy:
    canary:
      # Traffic shifting via the stable/canary Service selectors.
      # If you use Istio or NGINX ingress controller, replace with:
      #   trafficRouting:
      #     istio: { ... } | nginx: { ... }
      canaryService: api-canary
      stableService: api-stable

      steps:
        # Step 1: 10% canary, bake for 1 minute
        - setWeight: 10
        - pause:
            duration: 1m

        # Step 2: 30% canary, manual gate for smoke test sign-off
        - setWeight: 30
        - pause: {}              # waits for: kubectl argo rollouts promote api

        # Step 3: 60% canary, bake for 2 minutes
        - setWeight: 60
        - pause:
            duration: 2m

        # Step 4: Full rollout
        - setWeight: 100

      # ── Automated rollback analysis ──────────────────────────────────────
      # Argo Rollouts queries Prometheus during the canary bake period.
      # If the error-rate metric exceeds the threshold, the rollout is
      # automatically aborted and traffic shifts back to stable.
      analysis:
        templates:
          - templateName: api-error-rate
        startingStep: 1         # start analysis after first setWeight
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary

---
# AnalysisTemplate: query Prometheus for the canary error rate.
# Abort if 5xx rate > 1% over a 2-minute window.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-error-rate
  namespace: religiogram
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 30s
      count: 4                  # run 4 measurements (2 minutes total)
      successCondition: result[0] < 0.01
      failureLimit: 1           # abort after 1 failed measurement
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(
              rate(http_requests_total{
                app="api",
                pod_template_hash="{{ args.canary-hash }}",
                status=~"5.."
              }[2m])
            ) /
            sum(
              rate(http_requests_total{
                app="api",
                pod_template_hash="{{ args.canary-hash }}"
              }[2m])
            )

---
# Canary Service — routes canary traffic (subset of pods with canary hash)
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: religiogram
  labels:
    app: api
    variant: canary
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP

---
# Stable Service — routes production traffic to stable pods
apiVersion: v1
kind: Service
metadata:
  name: api-stable
  namespace: religiogram
  labels:
    app: api
    variant: stable
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
