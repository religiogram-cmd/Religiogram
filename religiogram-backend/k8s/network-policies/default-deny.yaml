---
# ── Default-deny NetworkPolicy ────────────────────────────────────────────────
#
# Applies to ALL pods in the "religiogram" namespace.
# Denies all ingress and egress traffic that is not explicitly permitted by a
# more-specific NetworkPolicy below.
#
# Effect:
#   • A pod that has no matching allow rule cannot receive OR send any traffic.
#   • New pods are isolated by default — you must opt-in to connectivity.
#
# This prevents:
#   - Lateral movement if a pod is compromised
#   - Accidental cross-service communication
#   - Data exfiltration via unexpected egress paths
#
# Apply: kubectl apply -f k8s/network-policies/default-deny.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: religiogram
  labels:
    component: network-security
spec:
  podSelector: {}   # matches ALL pods in namespace
  policyTypes:
    - Ingress
    - Egress
  # No ingress/egress rules → all traffic denied by default
