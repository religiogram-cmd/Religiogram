---
# ── Kafka — accept connections from API pods + kafka-exporter ────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: religiogram
  labels:
    component: network-security
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: kafka-exporter
        - podSelector:
            matchLabels:
              app: kafka    # inter-broker replication
      ports:
        - protocol: TCP
          port: 29092
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
  egress:
    # Inter-broker replication + ZooKeeper
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 29092
        - protocol: TCP
          port: 9093
    - to:
        - podSelector:
            matchLabels:
              app: zookeeper
      ports:
        - protocol: TCP
          port: 2181
---
# ── OpenSearch — accept connections from API pods + opensearch-dashboards ─────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opensearch-ingress
  namespace: religiogram
  labels:
    component: network-security
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: opensearch-dashboards
        - podSelector:
            matchLabels:
              app: opensearch    # inter-node transport
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300   # inter-node transport
        - protocol: TCP
          port: 9600   # performance analyzer
  egress:
    # Inter-node cluster communication
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
